<script id="zoinhoCloudBootPrimer">
(() => {
  window.zoinhoCloudScriptFailed = () => {
    const get = id => document.getElementById(id);
    document.documentElement.classList.add('zoinho-cloud-booting');
    get('zoinhoCloudBoot').dataset.stage = 'error';
    get('zoinhoCloudBootTitle').textContent = 'Conexão indisponível';
    get('zoinhoCloudBootDetail').textContent = 'Não foi possível carregar a conexão com a nuvem. Seu checkpoint local foi preservado.';
    const retry = get('zoinhoCloudRetry'), offline = get('zoinhoCloudOffline');
    retry.hidden = offline.hidden = false;
    retry.onclick = () => location.reload();
    offline.onclick = () => { document.documentElement.classList.remove('zoinho-cloud-booting');get('zoinhoCloudBoot').remove(); };
  };
  try {
    if (new URLSearchParams(location.search).get('zoinhoBridge') === '1') {
      document.documentElement.classList.add('zoinho-cloud-booting');
    }
  } catch {}
})();
</script>

function syncLoop(id,active,dt,opts={}){

 }

 if(hardPaused){setMusic(null);return}

 if(ladder){
  const running=cutscene.time>=10&&cutscene.time<COAST_LADDER_SECONDS;
  if(running)setMusic('snake',{volume:ladderMusicGain(cutscene.time),seek:cutscene.time-10,restart:gameAudio.musicScene!==cutscene});else setMusic(null);
  gameAudio.musicScene=cutscene;return;

function updateGameAudio(dt){

 if(voicePaused){if(gameAudio.queue.length||Object.values(gameAudio.voices).some(p=>p.tracks.some(a=>!a.paused)))clearVoiceAudio()}
 else{gameAudio.clock+=dt;const pending=gameAudio.queue;gameAudio.queue=[];for(const job of pending){if(job.at>gameAudio.clock){gameAudio.queue.push(job);continue}const pool=gameAudio.voices[job.id],a=pool.tracks[pool.index++%pool.tracks.length];try{a.pause();a.currentTime=0;a.playbackRate=job.pitch/DIALOGUE_VOICES[job.id].hz;a.volume=1;const p=a.play();if(p?.catch)p.catch(e=>devWarn('voice-play',e))}catch(e){devWarn('audio-state',e)}}}

 const frozen=mode=='pause'||mode=='title'||mode=='controls'||mode=='over';
 const alertActive=!!alertNow;
 if(!frozen&&alertActive&&!gameAudio.alertWas){playSfx('alerta',{volume:.88});gameAudio.alertDelay=1}
 if(!alertActive)gameAudio.alertDelay=0;else if(!frozen)gameAudio.alertDelay=Math.max(0,gameAudio.alertDelay-dt);

 const walking=!playerJeep()&&!frozen&&mode=='play'&&!transition&&P?.mv&&!P.sn&&!P.box&&!hacking&&!defusing&&areaId!='seaRoute';
 const walkRate=(areaId=='prison'||areaId=='balcony')?8:10;
 syncLoop('andar',walking,dt,{volume:.43,rate:.476*walkRate/Math.PI,fade:8,hardStop:!walking,restart:true,reset:true});

 const ladder=areaId=='balcony'&&cutscene?.kind=='coastLadder'&&mode=='cutscene'&&!cutscene.paused;
 syncLoop('escada',ladder,dt,{volume:.56,rate:1,fade:3,seek:ladder?cutscene.time:0});

 const seaOpening=mode=='opening'&&opening&&!opening.paused&&['flight','fade','arrival'].includes(opening.phase);
 const seaCoast=areaId=='coast'&&!frozen&&mode!='elevatorRide';
 const seaBalcony=areaId=='balcony'&&!frozen&&cutscene?.kind!='coastLadder';

function jeepTerrainHit(x,y,a){

 for(let ty=Math.floor((y-ry)/T);ty<=Math.floor((y+ry)/T);ty++)for(let tx=Math.floor((x-rx)/T);tx<=Math.floor((x+rx)/T);tx++){

  if(Math.abs(dx)<rx+8&&Math.abs(dy)<ry+8&&Math.abs(dx*c+dy*s)<25+8*(Math.abs(c)+Math.abs(s))&&Math.abs(-dx*s+dy*c)<13+8*(Math.abs(c)+Math.abs(s)))return true;

}
function grappleGunMuzzle(){

function cinemaGunPose(e,c,enemy=false){

 const x=e.x+Math.cos(a)*(5-recoil),y=e.y-3+Math.sin(a)*(5-recoil),type=enemy?'pistol':(c.gunWeapon||(P.inv.weapon==='mk22'?'mk22':'pistol'));
 const silent=!enemy&&(c.kind==='torture'?(P.inv.sil[type]||0)>0:false),muzzle=handgunMuzzle(x,y,a,type,silent);
 const side=Math.abs(Math.cos(e.a))>Math.abs(Math.sin(e.a)),sign=Math.cos(e.a)<0?-1:1;

 return{x,y,a,type,silent,muzzle,kick,arms};
